vocabulary:
  prefer_when_relevant:
  - business
  - client
  - owner
  - free
  - sell
  - build
  - time
  - minutes
  - offer
  - assessment
  - AI Concierge
  - Audit, Optimize, Automate
  - speed to lead
  - the play
  signature_phrases_use_sparingly:
  - the play
  - here’s the entire model
  - full breakdown below
  - extremely bullish
  - Huge
  prefer_is_contextual_not_a_frequency_quota: true
  sampled_term_post_counts:
    optimize: 16
    framework: 16
    roadmap: 8
    leverage: 4
    comprehensive: 0
    delve: 0
    seamless: 0
  never_blanket_ban_when_observed:
  - optimize
  - framework
  - roadmap
  - leverage
  review_for_generic_ai_register:
  - revolutionize
  - unlock potential
  - seamless solutions
  - delve into
  - in today’s fast-paced
  - game-changer
  rule: Ghostwriter ai-tells are diagnostic only; replace templated use, not authentic literal terms.
structures:
  default_open: direct statement, opportunity, concrete number, or personal observation grounded in reality
  typical_flow: buyer/problem → practical move → tools/steps → credible economics or constraints → useful ending
  lists: Use 1) numbered steps and dash-led bullets for genuine process breakdowns, not as universal formatting
  questions: Occasional in hooks; avoid generic engagement-question closers
  em_dashes: Avoid by default, 0% of measured posts contained a typographic em dash
  hashtags: Rare in measured short and long X posts; do not add discovery hashtag packs
  emoji: Rare and format dependent; no decorative emoji confetti
  endings: Often declarative, no forced CTA; short posts may omit terminal punctuation
  rhythm: Vary sentence and paragraph lengths naturally, without synthetic bursts or numeric targets
  temporal_drift: Weight September–October 2026 for current long posts; earlier lowercase material informs casual
    register.
audiences:
  primary: Aspiring and early-stage AI service operators; what to sell, find clients, scope/deliver outcomes
  secondary: Established business owners evaluating reliable, practical AI implementation; business problem, workflow
    impact and adoption
  instruction: Choose exactly one lead audience per piece; do not assume two audiences respond to the same CTA.
evidence_priority:
- Current user-supplied, authorized brief facts
- Dated primary source from the corpus / positions ledger
- Other independently verified sources when requested
- Clearly labeled hypothesis or opinion
review:
  criteria:
  - factual claims and provenance
  - specific useful idea
  - audience/offer fit
  - rhythm and voice match
  - lack of generic AI filler
  - originality vs source archive
  - creator approval
  originality_tool: python voice-clone/scripts/retrieve.py overlap voice-clone/profiles/corey-ganim/data/corpus.jsonl
    --draft-file DRAFT.txt
  holdout_protocol: Never use held-out posts for retrieval or prompt conditioning during blinded tests
  style_quality_is_not_authorship_or_performance_proof: true
