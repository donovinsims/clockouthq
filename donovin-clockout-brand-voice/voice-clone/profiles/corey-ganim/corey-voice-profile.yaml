    confidence:
      value: 0.86
      rationale: Direct conclusions, commands and strong business claims
    warmth:
      value: 0.54
      rationale: Practical second-person help, occasional bluntness and personal reports
    energy:
      value: 0.72
      rationale: Action oriented, selective enthusiasm and uppercase emphasis, very few emojis
    complexity:
      value: 0.49
      rationale: Accessible language with concrete workflows and conditional business reasoning
